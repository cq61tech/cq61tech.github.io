<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cq61tech repo</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #00ffcc;
            font-family: monospace;
            text-align: center;
            padding: 50px 20px;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }
        p {
            color: #888;
            margin-bottom: 30px;
        }
        .btn-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        .repo-btn {
            display: inline-block;
            width: 250px;
            padding: 12px 20px;
            background: #1a1a1a;
            border: 1px solid #00ffcc;
            color: #00ffcc;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.2s;
        }
        .repo-btn:hover {
            background: #00ffcc;
            color: #0d0d0d;
            box-shadow: 0 0 15px #00ffcc;
        }
    </style>
</head>
<body>

    <h1>cq61tech repo</h1>
    <p>Legacy & Modern iOS Tweaks</p>

    <div class="btn-container">
        <a class="repo-btn" href="cydia://url/add_source?source=https://cq61tech.github.io/">Add to Cydia</a>
        <a class="repo-btn" href="sileo://source/https://cq61tech.github.io/">Add to Sileo</a>
        <a class="repo-btn" href="zbra://sources/add?https://cq61tech.github.io/">Add to Zebra</a>
    </div>

</html>
